name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: Gates (format, types, tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: NEXT_TELEMETRY_DISABLED=1 npm run build
      - run: npm audit --omit=dev
  browser:
    name: Browser acceptance (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the browser acceptance suite
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload the HTML report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image build + entrypoint smoke
    runs-on: ubuntu-latest
    # packages: read lets the upgrade smoke pull previously published release
    # images from GHCR (contents: read is the default, restated for clarity).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the upgrade smoke resolves the most recent
          # eligible v1+ product-line tag.
          fetch-depth: 0
      - name: Build production image
        run: docker build -t simple-finance:ci .
      - name: Log in to GHCR (pull access for the upgrade smoke)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Upgrade smoke test (latest published v1+ release must migrate cleanly)
        run: |
          set -eu
          # The original v0.23.0 migration bug showed why the upgrade path
          # matters, but this repository's inherited v0.x tags belong to the
          # original product and have no images in this package. Only use
          # published v1+ images from this product line. The Publish workflow
          # repeats the check against the two most recent eligible releases.
          EXPECTED_REPOSITORY="dougalbob/simple-finance-multi-household"
          if [ "${GITHUB_REPOSITORY,,}" != "$EXPECTED_REPOSITORY" ]; then
            echo "Refusing Docker upgrade smoke for $GITHUB_REPOSITORY; expected $EXPECTED_REPOSITORY" >&2
            exit 1
          fi
          IMAGE="ghcr.io/dougalbob/simple-finance-multi-household"
          PR_VERSION="v$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          # A tag only counts as an upgrade base when its image actually exists
          # in GHCR. A tag whose publish failed before pushing (v1.0.0-rc.1 and
          # v1.0.0-rc.2 both did) has no image, and selecting one makes this job
          # fail on `docker pull` instead of testing an upgrade. Same rule as
          # the Publish workflow.
          BASE_TAG=""
          for CANDIDATE in $(git tag --sort=-v:refname | grep -E '^v[1-9][0-9]*\.' | grep -v "^${PR_VERSION}$" || true); do
            if docker buildx imagetools inspect "$IMAGE:$CANDIDATE" >/dev/null 2>&1; then
              BASE_TAG="$CANDIDATE"
              break
            fi
            echo "skipping $CANDIDATE: no image published in $IMAGE"
          done
          if [ -z "$BASE_TAG" ]; then
            echo "no previously published v1+ tag found - skipping upgrade smoke"
            exit 0
          fi
          echo "=== upgrade smoke: $BASE_TAG -> this PR's image ==="
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          HOUSEHOLD_ID="0123456789abcdef0123456789abcdef"
          TENANT_DB="/data/households/$HOUSEHOLD_ID/simple-finance.sqlite"
          seed_household() {
            local data_dir="$1"
            local image="$2"
            docker run --rm -v "$data_dir:/data" --entrypoint node "$image" scripts/registry-migrate.cjs
            docker run --rm -e HOUSEHOLD_ID="$HOUSEHOLD_ID" -v "$data_dir:/data" --entrypoint node "$image" -e '
              const Database = require("better-sqlite3");
              const id = process.env.HOUSEHOLD_ID;
              if (!/^[a-f0-9]{32}$/.test(id || "")) throw new Error("invalid smoke-test household ID");
              const db = new Database("/data/system/registry.sqlite");
              const now = new Date().toISOString();
              db.prepare("INSERT INTO households (id, display_name, status, created_at, updated_at) VALUES (?, ?, ?, ?, ?)")
                .run(id, "CI smoke household", "active", now, now);
              db.close();
            '
          }
          check_tenant_database() {
            local container="$1"
            docker exec "$container" node -e '
              const fs = require("fs");
              const Database = require("better-sqlite3");
              const file = process.argv[1];
              if (!fs.existsSync(file)) throw new Error("tenant database was not created: " + file);
              const db = new Database(file, { readonly: true });
              const row = db.prepare("SELECT COUNT(*) AS count FROM __drizzle_migrations").get();
              db.close();
              if (!row || row.count === 0) throw new Error("tenant database has no applied migrations");
              console.log("tenant database exists with " + row.count + " migrations: " + file);
            ' "$TENANT_DB"
          }
          docker pull "$IMAGE:$BASE_TAG"
          VOL="sf-upg-$(echo "$BASE_TAG" | tr '.' '-')"
          docker volume create "$VOL" >/dev/null
          seed_household "$VOL" "$IMAGE:$BASE_TAG"
          docker run -d --name sf-upg-base -p 3000:3000 -v "$VOL":/data $AUTH_ENV "$IMAGE:$BASE_TAG"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          check_tenant_database sf-upg-base
          docker exec sf-upg-base node -e '
            const Database = require("better-sqlite3");
            const db = new Database(process.argv[1]);
            db.exec("CREATE TABLE IF NOT EXISTS ci_upgrade_probe (key TEXT PRIMARY KEY, value TEXT NOT NULL)");
            db.prepare("INSERT OR REPLACE INTO ci_upgrade_probe (key, value) VALUES (?, ?)")
              .run("tenant-persistence", "preserved");
            db.close();
          ' "$TENANT_DB"
          echo "base $BASE_TAG: healthy, registry-selected tenant database migrated"
          docker rm -f sf-upg-base
          docker run -d --name sf-upg-new -p 3000:3000 -v "$VOL":/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "upgraded $BASE_TAG -> this PR's image: healthy"
          docker exec sf-upg-new node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const Database = require("better-sqlite3");
            const folder = "/app/drizzle";
            const journal = JSON.parse(fs.readFileSync(folder + "/meta/_journal.json", "utf8"));
            const file = process.argv[1];
            const db = new Database(file, { readonly: true });
            const probe = db.prepare("SELECT value FROM ci_upgrade_probe WHERE key = ?").get("tenant-persistence");
            if (!probe || probe.value !== "preserved") throw new Error("tenant data did not survive upgrade");
            const rows = db.prepare("SELECT hash, created_at FROM __drizzle_migrations").all();
            const byHash = new Map();
            for (const row of rows) byHash.set(row.hash, Number(row.created_at));
            let bad = 0;
            for (const entry of journal.entries) {
              const sql = fs.readFileSync(folder + "/" + entry.tag + ".sql", "utf8");
              const hash = crypto.createHash("sha256").update(sql).digest("hex");
              const at = byHash.get(hash);
              if (at === undefined) { console.log("NOT APPLIED:", entry.tag); bad += 1; }
              else if (at !== entry.when) { console.log("STAMP MISMATCH:", entry.tag, "db=" + at, "journal=" + entry.when); bad += 1; }
            }
            db.close();
            if (bad > 0) { console.log(bad + " journal entries are not applied exactly once"); process.exit(1); }
            console.log("all " + journal.entries.length + " journal entries applied exactly once; tenant marker preserved");
          ' "$TENANT_DB"
          docker rm -f sf-upg-new
          docker volume rm "$VOL"
      - name: Smoke test (start, health, unprivileged, volume, bind-mount ownership)
        run: |
          set -eu
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          docker run -d --name sf-run1 -p 3000:3000 $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "first start: healthy"
          # The server must not be running as root (least privilege).
          SERVER_UID="$(docker exec sf-run1 awk '/^Uid:/{print $2}' /proc/1/status)"
          test "$SERVER_UID" = "99" || { echo "server runs as uid $SERVER_UID, expected 99" >&2; exit 1; }
          echo "least privilege: uid 99"
          docker rm -f sf-run1

          HOUSEHOLD_ID="0123456789abcdef0123456789abcdef"
          TENANT_DB="/data/households/$HOUSEHOLD_ID/simple-finance.sqlite"
          TENANT_DOCS="/data/households/$HOUSEHOLD_ID/documents"
          seed_household() {
            local data_dir="$1"
            local image="$2"
            docker run --rm -v "$data_dir:/data" --entrypoint node "$image" scripts/registry-migrate.cjs
            docker run --rm -e HOUSEHOLD_ID="$HOUSEHOLD_ID" -v "$data_dir:/data" --entrypoint node "$image" -e '
              const Database = require("better-sqlite3");
              const id = process.env.HOUSEHOLD_ID;
              if (!/^[a-f0-9]{32}$/.test(id || "")) throw new Error("invalid smoke-test household ID");
              const db = new Database("/data/system/registry.sqlite");
              const now = new Date().toISOString();
              db.prepare("INSERT INTO households (id, display_name, status, created_at, updated_at) VALUES (?, ?, ?, ?, ?)")
                .run(id, "CI smoke household", "active", now, now);
              db.close();
            '
          }
          check_tenant_database() {
            local container="$1"
            docker exec "$container" node -e '
              const fs = require("fs");
              const Database = require("better-sqlite3");
              const file = process.argv[1];
              if (!fs.existsSync(file)) throw new Error("tenant database was not created: " + file);
              const db = new Database(file, { readonly: true });
              const row = db.prepare("SELECT COUNT(*) AS count FROM __drizzle_migrations").get();
              db.close();
              if (!row || row.count === 0) throw new Error("tenant database has no applied migrations");
              console.log("tenant database exists with " + row.count + " migrations: " + file);
            ' "$TENANT_DB"
          }

          docker volume create sf-smoke-data >/dev/null
          seed_household sf-smoke-data simple-finance:ci
          docker run -d --name sf-run2 -p 3000:3000 -v sf-smoke-data:/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          check_tenant_database sf-run2
          docker exec sf-run2 node -e '
            const Database = require("better-sqlite3");
            const db = new Database(process.argv[1]);
            db.exec("CREATE TABLE IF NOT EXISTS ci_persistence_probe (key TEXT PRIMARY KEY, value TEXT NOT NULL)");
            db.prepare("INSERT OR REPLACE INTO ci_persistence_probe (key, value) VALUES (?, ?)")
              .run("tenant-persistence", "preserved");
            db.close();
          ' "$TENANT_DB"
          docker rm -f sf-run2
          docker run -d --name sf-run2-recreated -p 3000:3000 -v sf-smoke-data:/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          docker exec sf-run2-recreated node -e '
            const Database = require("better-sqlite3");
            const db = new Database(process.argv[1], { readonly: true });
            const row = db.prepare("SELECT value FROM ci_persistence_probe WHERE key = ?").get("tenant-persistence");
            db.close();
            if (!row || row.value !== "preserved") throw new Error("tenant database did not persist across container recreation");
          ' "$TENANT_DB"
          echo "registry-selected tenant database persisted across container recreation"
          docker rm -f sf-run2-recreated
          docker volume rm sf-smoke-data

          # Regression for tenant ownership on an Unraid-style bind mount. Keep
          # the mount root owned by uid 99 while the tenant subtree is root-owned;
          # the entrypoint must repair the tenant tree recursively. Legacy root-
          # level database/documents fixtures must remain completely untouched.
          mkdir -p "/tmp/sf-bind/system" "/tmp/sf-bind/households/$HOUSEHOLD_ID/documents" /tmp/sf-bind/documents
          sudo chown -R 99:100 /tmp/sf-bind
          sudo sh -c 'printf "legacy-root-db-fixture-do-not-open\\n" > /tmp/sf-bind/simple-finance.sqlite; printf "legacy-documents-fixture-do-not-touch\\n" > /tmp/sf-bind/documents/legacy.keep'
          sudo chown -R 0:0 "/tmp/sf-bind/households/$HOUSEHOLD_ID" /tmp/sf-bind/documents
          seed_household /tmp/sf-bind simple-finance:ci
          LEGACY_DB_HASH="$(sha256sum /tmp/sf-bind/simple-finance.sqlite | cut -d ' ' -f1)"
          docker run -d --name sf-run3 -p 3000:3000 -v /tmp/sf-bind:/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "bind mount with a root-owned tenant subtree: healthy"
          check_tenant_database sf-run3
          TENANT_DOCS_OWNER="$(docker exec sf-run3 stat -c %u:%g "$TENANT_DOCS")"
          test "$TENANT_DOCS_OWNER" = "99:100" || { echo "tenant documents/ is $TENANT_DOCS_OWNER, expected 99:100" >&2; exit 1; }
          echo "tenant documents/ repaired to 99:100"
          docker exec -u 99:100 sf-run3 sh -c 'touch "$1/.ci-write-probe" && rm -f "$1/.ci-write-probe"' _ "$TENANT_DOCS"
          echo "tenant documents/ writable by uid 99"
          LEGACY_DOCS_OWNER="$(docker exec sf-run3 stat -c %u:%g /data/documents)"
          LEGACY_DB_OWNER="$(docker exec sf-run3 stat -c %u:%g /data/simple-finance.sqlite)"
          test "$LEGACY_DOCS_OWNER" = "0:0" || { echo "legacy /data/documents was changed to $LEGACY_DOCS_OWNER" >&2; exit 1; }
          test "$LEGACY_DB_OWNER" = "0:0" || { echo "legacy root-level database was changed to $LEGACY_DB_OWNER" >&2; exit 1; }
          test "$(sha256sum /tmp/sf-bind/simple-finance.sqlite | cut -d ' ' -f1)" = "$LEGACY_DB_HASH" || { echo "legacy root-level database contents changed" >&2; exit 1; }
          test -f /tmp/sf-bind/documents/legacy.keep || { echo "legacy document was removed" >&2; exit 1; }
          echo "legacy root-level paths left untouched"
          docker rm -f sf-run3
          sudo rm -rf /tmp/sf-bind

          # PWA assets: manifest and icons must be served from the image's
          # public/ directory.  No Access cookie is required — these paths
          # are bypassed at the Cloudflare level in the real installation.
          docker run -d --name sf-run4 -p 3000:3000 $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for PWA_PATH in /manifest.webmanifest /icon-192.png /icon-512.png /apple-touch-icon.png; do
            HTTP_CODE="$(curl -sI -o /dev/null -w '%{http_code}' http://127.0.0.1:3000$PWA_PATH)"
            test "$HTTP_CODE" = "200" || { echo "$PWA_PATH returned $HTTP_CODE, expected 200" >&2; exit 1; }
            echo "PWA asset $PWA_PATH: 200"
          done
          # Verify content types.
          curl -sI http://127.0.0.1:3000/manifest.webmanifest | grep -qi 'application/manifest+json'
          echo "manifest content-type: application/manifest+json"
          curl -sI http://127.0.0.1:3000/icon-192.png | grep -qi 'image/png'
          echo "icon content-type: image/png"
          docker rm -f sf-run4
