name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: Gates (format, types, tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: NEXT_TELEMETRY_DISABLED=1 npm run build
      - run: npm audit --omit=dev
  browser:
    name: Browser acceptance (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the browser acceptance suite
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload the HTML report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image build + entrypoint smoke
    runs-on: ubuntu-latest
    # packages: read lets the upgrade smoke pull previously published release
    # images from GHCR (contents: read is the default, restated for clarity).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the upgrade smoke resolves the most recently
          # published release tag.
          fetch-depth: 0
      - name: Build production image
        run: docker build -t simple-finance:ci .
      - name: Log in to GHCR (pull access for the upgrade smoke)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Upgrade smoke test (latest published release must migrate cleanly)
        run: |
          set -eu
          # v0.23.0 shipped with an out-of-order migration journal stamp that
          # silently skipped migration 0012 on upgraded databases while fresh
          # installs stayed green (docs/RELEASE_NOTES_v0.23.1.md). The Docker
          # job therefore upgrades the most recently published release image
          # to this build on the same volume before anything merges; the
          # Publish workflow repeats the check against the two most recent
          # releases before pushing.
          PR_VERSION="v$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          BASE_TAG="$(git tag --sort=-v:refname | grep -v "^${PR_VERSION}$" | head -1 || true)"
          if [ -z "$BASE_TAG" ]; then
            echo "no previously published tag found - skipping upgrade smoke"
            exit 0
          fi
          echo "=== upgrade smoke: $BASE_TAG -> this PR's image ==="
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          docker pull "$IMAGE:$BASE_TAG"
          VOL="sf-upg-$(echo "$BASE_TAG" | tr '.' '-')"
          docker run -d --name sf-upg-base -p 3000:3000 -v "$VOL":/data $AUTH_ENV "$IMAGE:$BASE_TAG"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "base $BASE_TAG: healthy, database created"
          docker rm -f sf-upg-base
          docker run -d --name sf-upg-new -p 3000:3000 -v "$VOL":/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "upgraded $BASE_TAG -> this PR's image: healthy"
          docker exec sf-upg-new node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const Database = require("better-sqlite3");
            const folder = "/app/drizzle";
            const journal = JSON.parse(fs.readFileSync(folder + "/meta/_journal.json", "utf8"));
            const db = new Database("/data/simple-finance.sqlite", { readonly: true });
            const rows = db.prepare("SELECT hash, created_at FROM __drizzle_migrations").all();
            const byHash = new Map();
            for (const row of rows) byHash.set(row.hash, Number(row.created_at));
            let bad = 0;
            for (const entry of journal.entries) {
              const sql = fs.readFileSync(folder + "/" + entry.tag + ".sql", "utf8");
              const hash = crypto.createHash("sha256").update(sql).digest("hex");
              const at = byHash.get(hash);
              if (at === undefined) { console.log("NOT APPLIED:", entry.tag); bad += 1; }
              else if (at !== entry.when) { console.log("STAMP MISMATCH:", entry.tag, "db=" + at, "journal=" + entry.when); bad += 1; }
            }
            db.close();
            if (bad > 0) { console.log(bad + " journal entries are not applied exactly once"); process.exit(1); }
            console.log("all " + journal.entries.length + " journal entries applied exactly once");
          '
          docker rm -f sf-upg-new
          docker volume rm "$VOL"
      - name: Smoke test (start, health, unprivileged, volume, bind-mount ownership)
        run: |
          set -eu
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          docker run -d --name sf-run1 -p 3000:3000 $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "first start: healthy"
          # The server must not be running as root (least privilege).
          SERVER_UID="$(docker exec sf-run1 awk '/^Uid:/{print $2}' /proc/1/status)"
          test "$SERVER_UID" = "99" || { echo "server runs as uid $SERVER_UID, expected 99" >&2; exit 1; }
          echo "least privilege: uid 99"
          docker rm -f sf-run1

          docker run -d --name sf-run2 -p 3000:3000 -v sf-smoke-data:/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "recreated container with existing volume: healthy"
          test -n "$(docker exec sf-run2 ls -A /data/simple-finance.sqlite)"
          echo "database persisted across container recreation"
          docker rm -f sf-run2
          docker volume rm sf-smoke-data

          # Regression for the v0.1.1 field bug: a BIND MOUNT (Unraid's appdata
          # folder) whose root is already PUID:PGID while documents/ is still
          # root-owned. The entrypoint used to gate its recursive chown on the
          # mount root alone, so documents/ was never repaired and the first
          # receipt upload died with EACCES. A named volume cannot reproduce
          # this: it inherits the image's already-correct /data ownership.
          mkdir -p /tmp/sf-bind/documents
          sudo chown -R 99:100 /tmp/sf-bind
          sudo chown -R 0:0 /tmp/sf-bind/documents
          docker run -d --name sf-run3 -p 3000:3000 -v /tmp/sf-bind:/data $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "bind mount with a root-owned documents/: healthy"
          DOCS_OWNER="$(docker exec sf-run3 stat -c %u:%g /data/documents)"
          test "$DOCS_OWNER" = "99:100" || { echo "documents/ is $DOCS_OWNER, expected 99:100" >&2; exit 1; }
          echo "documents/ repaired to 99:100"
          # ...and the server user can really write a receipt into it.
          docker exec -u 99:100 sf-run3 sh -c 'touch /data/documents/.ci-write-probe && rm -f /data/documents/.ci-write-probe'
          echo "documents/ writable by uid 99"
          docker rm -f sf-run3
          sudo rm -rf /tmp/sf-bind

          # PWA assets: manifest and icons must be served from the image's
          # public/ directory.  No Access cookie is required — these paths
          # are bypassed at the Cloudflare level in the real installation.
          docker run -d --name sf-run4 -p 3000:3000 $AUTH_ENV simple-finance:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for PWA_PATH in /manifest.webmanifest /icon-192.png /icon-512.png /apple-touch-icon.png; do
            HTTP_CODE="$(curl -sI -o /dev/null -w '%{http_code}' http://127.0.0.1:3000$PWA_PATH)"
            test "$HTTP_CODE" = "200" || { echo "$PWA_PATH returned $HTTP_CODE, expected 200" >&2; exit 1; }
            echo "PWA asset $PWA_PATH: 200"
          done
          # Verify content types.
          curl -sI http://127.0.0.1:3000/manifest.webmanifest | grep -qi 'application/manifest+json'
          echo "manifest content-type: application/manifest+json"
          curl -sI http://127.0.0.1:3000/icon-192.png | grep -qi 'image/png'
          echo "icon content-type: image/png"
          docker rm -f sf-run4
