name: Publish

# Tag-triggered publication for the independent multi-household product.
# Merging a PR publishes nothing; a valid v1+ tag does. The first planned tag
# is v1.0.0-rc.1. RCs publish an exact version and sha tag only: never latest.
# Stable releases (starting at v1.0.0) also move latest. See
# docs/MULTI_HOUSEHOLD_PLAN.md and docs/RELEASE_PROCESS.md.
#
# HARD BOUNDARY: this workflow is allowed to push only to
# ghcr.io/dougalbob/simple-finance-multi-household. A repository identity guard
# below fails closed. The inherited v0.x tags belong to the original
# single-household project, must never be released here, and are not upgrade
# bases for this package.
#
# Every build is fresh-start smoke-tested; upgrades are tested only from
# already-versioned v1+ product-line tags in this repository. Images are
# pushed only after smoke tests pass, and the workflow verifies every tag's
# digest before creating the matching GitHub release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v1+ SemVer tag (e.g. v1.0.0-rc.1 or v1.0.0)'
        required: true

# contents: write is needed for the final step, which creates the GitHub
# release from the checked-in notes document (docs/RELEASE_PROCESS.md).
permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, smoke test and push the release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the upgrade smoke resolves previously published
          # release tags, and the release step needs the notes document.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version and image name
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"
          EXPECTED_REPOSITORY="dougalbob/simple-finance-multi-household"
          EXPECTED_IMAGE="ghcr.io/dougalbob/simple-finance-multi-household"
          ACTUAL_REPOSITORY="${GITHUB_REPOSITORY,,}"
          if [ "$ACTUAL_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "Refusing to publish: repository is $GITHUB_REPOSITORY, expected $EXPECTED_REPOSITORY" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Refusing invalid release tag: $VERSION (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          if [ "$MAJOR" -lt 1 ]; then
            echo "Refusing inherited v0.x tag: this product line starts at v1.0.0-rc.1" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-rc.* ]]; then PRERELEASE=true; fi
          IMAGE="$EXPECTED_IMAGE"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAGS="$(printf '%s\n%s' "$IMAGE:$VERSION" "$IMAGE:sha-$SHORT_SHA")"
          PUSH_TAGS="$VERSION sha-$SHORT_SHA"
          if [ "$PRERELEASE" = false ]; then
            TAGS="$(printf '%s\n%s' "$TAGS" "$IMAGE:latest")"
            PUSH_TAGS="$VERSION latest sha-$SHORT_SHA"
          fi
          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
            echo "short_sha=$SHORT_SHA"
            echo "prerelease=$PRERELEASE"
            echo "push_tags=$PUSH_TAGS"
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing to $IMAGE with tags: $PUSH_TAGS"

      - name: Verify the version metadata matches the tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MODULE_VERSION="$(node -p "require('fs').readFileSync('src/lib/version.ts','utf8').match(/APP_VERSION = '([^']+)'/)[1]")"
          test "v${PKG_VERSION}" = "$VERSION" || { echo "package.json ($PKG_VERSION) does not match $VERSION" >&2; exit 1; }
          test "v${MODULE_VERSION}" = "$VERSION" || { echo "src/lib/version.ts ($MODULE_VERSION) does not match $VERSION" >&2; exit 1; }
          echo "version metadata agrees with $VERSION"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Simple Finance Multi-household
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade smoke test (previously published releases must migrate cleanly)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          # Only inspect this product line's tags at v1 or above, across
          # major versions. The inherited v0.x source tags have no images in
          # this GHCR package and must never be pulled. The first v1.0.0-rc.1
          # therefore correctly skips upgrade smoke; later releases upgrade
          # the two most recent product-line images on a shared volume and
          # check every migration exactly once.
          BASE_TAGS="$(git tag --sort=-v:refname | grep -E '^v[1-9][0-9]*\.' | grep -v "^${VERSION}$" | head -2 || true)"
          if [ -z "$BASE_TAGS" ]; then
            echo "no previously published tag found - skipping upgrade smoke"
            exit 0
          fi
          for BASE_TAG in $BASE_TAGS; do
            echo "=== upgrade smoke: $BASE_TAG -> $VERSION ==="
            docker pull "$IMAGE:$BASE_TAG"
            VOL="sf-upg-$(echo "$BASE_TAG" | tr '.' '-')"
            docker run -d --name sf-upg-base -p 3000:3000 -v "$VOL":/data $AUTH_ENV "$IMAGE:$BASE_TAG"
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:3000/api/health
            echo "base $BASE_TAG: healthy, database created"
            docker rm -f sf-upg-base
            docker run -d --name sf-upg-new -p 3000:3000 -v "$VOL":/data $AUTH_ENV "$IMAGE:$VERSION"
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:3000/api/health
            echo "upgraded $BASE_TAG -> $VERSION: healthy"
            docker exec sf-upg-new node -e '
              const fs = require("fs");
              const crypto = require("crypto");
              const Database = require("better-sqlite3");
              const folder = "/app/drizzle";
              const journal = JSON.parse(fs.readFileSync(folder + "/meta/_journal.json", "utf8"));
              const db = new Database("/data/simple-finance.sqlite", { readonly: true });
              const rows = db.prepare("SELECT hash, created_at FROM __drizzle_migrations").all();
              const byHash = new Map();
              for (const row of rows) byHash.set(row.hash, Number(row.created_at));
              let bad = 0;
              for (const entry of journal.entries) {
                const sql = fs.readFileSync(folder + "/" + entry.tag + ".sql", "utf8");
                const hash = crypto.createHash("sha256").update(sql).digest("hex");
                const at = byHash.get(hash);
                if (at === undefined) { console.log("NOT APPLIED:", entry.tag); bad += 1; }
                else if (at !== entry.when) { console.log("STAMP MISMATCH:", entry.tag, "db=" + at, "journal=" + entry.when); bad += 1; }
              }
              db.close();
              if (bad > 0) { console.log(bad + " journal entries are not applied exactly once"); process.exit(1); }
              console.log("all " + journal.entries.length + " journal entries applied exactly once");
            '
            docker rm -f sf-upg-new
            docker volume rm "$VOL"
          done

      - name: Smoke test the built image (start, health, unprivileged, persistence)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
        run: |
          set -eu
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          docker run -d --name sf-release -p 3000:3000 -v sf-release-data:/data $AUTH_ENV "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "health: ok"
          # Least privilege: the server process must not be running as root.
          SERVER_UID="$(docker exec sf-release awk '/^Uid:/{print $2}' /proc/1/status)"
          test "$SERVER_UID" = "99" || { echo "server runs as uid $SERVER_UID, expected 99" >&2; exit 1; }
          echo "least privilege: server runs as uid 99"
          test -n "$(docker exec sf-release ls -A /data/simple-finance.sqlite)"
          echo "database created under /data"
          docker rm -f sf-release
          docker run -d --name sf-release2 -p 3000:3000 -v sf-release-data:/data $AUTH_ENV "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test -n "$(docker exec sf-release2 ls -A /data/simple-finance.sqlite)"
          echo "database survived container recreation"
          docker rm -f sf-release2
          docker volume rm sf-release-data

          # PWA assets must be served by the published image.
          docker run -d --name sf-pwa -p 3000:3000 $AUTH_ENV "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for PWA_PATH in /manifest.webmanifest /icon-192.png /icon-512.png /apple-touch-icon.png; do
            HTTP_CODE="$(curl -sI -o /dev/null -w '%{http_code}' http://127.0.0.1:3000$PWA_PATH)"
            test "$HTTP_CODE" = "200" || { echo "$PWA_PATH returned $HTTP_CODE, expected 200" >&2; exit 1; }
            echo "PWA asset $PWA_PATH: 200"
          done
          docker rm -f sf-pwa

      - name: Push the verified image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          PUSH_TAGS: ${{ steps.meta.outputs.push_tags }}
        run: |
          set -eu
          for TAG in $PUSH_TAGS; do
            docker push "$IMAGE:$TAG"
          done
          if [ "$PRERELEASE" = true ]; then
            echo "### Published RC $IMAGE:$VERSION (sha-$SHORT_SHA; latest unchanged)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published stable $IMAGE:$VERSION (latest, sha-$SHORT_SHA)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the registry tags resolve
        id: verify
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PUSH_TAGS: ${{ steps.meta.outputs.push_tags }}
        run: |
          set -eu
          LOCAL_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          LOCAL_ONLY="${LOCAL_DIGEST#*@}"
          for TAG in $PUSH_TAGS; do
            REMOTE_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$TAG")"
            echo "$IMAGE:$TAG -> $REMOTE_DIGEST"
            test "$REMOTE_DIGEST" = "$LOCAL_ONLY" || {
              echo "Registry digest for $TAG ($REMOTE_DIGEST) does not match built image ($LOCAL_ONLY)" >&2
              exit 1
            }
          done
          echo "digest=$LOCAL_ONLY" >> "$GITHUB_OUTPUT"
          echo "### All published tag digests verified: $LOCAL_ONLY" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release from the checked-in notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          DIGEST: ${{ steps.verify.outputs.digest }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          PUSH_TAGS: ${{ steps.meta.outputs.push_tags }}
        run: |
          set -eu
          # Release notes ship in the release PR. The first line must be
          # '# Release notes — <exact-tag> — <subject>'. The workflow prepends
          # verified publication facts and marks RCs as prereleases; only a
          # stable release can become GitHub's Latest release.
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "$NOTES is missing - a release requires checked-in release notes" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists - leaving it untouched."
            exit 0
          fi
          TITLE="$(sed -n '1s/^# Release notes — //p' "$NOTES")"
          case "$TITLE" in
            "$VERSION — "*) ;;
            *) echo "The first line of $NOTES must start '# Release notes — $VERSION — '" >&2; exit 1 ;;
          esac
          IMAGE_TAGS=""
          for TAG in $PUSH_TAGS; do
            if [ -n "$IMAGE_TAGS" ]; then IMAGE_TAGS="$IMAGE_TAGS · "; fi
            IMAGE_TAGS="$IMAGE_TAGS$IMAGE:$TAG"
          done
          {
            echo "**Published:** $(date -u +%Y-%m-%d) by Publish run ${GITHUB_RUN_ID}."
            echo "**Merge commit:** \`${GITHUB_SHA}\` (short SHA \`$SHORT_SHA\`)."
            echo "**Image tags:** \`$IMAGE_TAGS\`."
            echo "**Digest:** \`$DIGEST\`, shared by all published tags and verified against the registry by this run."
            echo
            cat "$NOTES"
            echo
            echo "[Release notes document](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RELEASE_NOTES_${VERSION}.md)"
          } > /tmp/release-body.md
          if [ "$PRERELEASE" = true ]; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file /tmp/release-body.md --prerelease
            echo "### GitHub prerelease $VERSION created; Latest was not changed" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file /tmp/release-body.md --latest
            echo "### Stable GitHub release $VERSION created and marked Latest" >> "$GITHUB_STEP_SUMMARY"
          fi
