name: Publish

# Tag-triggered publication to GHCR (AGENT_APP_BLUEPRINT.md §7, §10):
# merging a PR does not publish anything — the release tag does.
#
# The image is smoke-tested BEFORE it is pushed: a broken image must not reach
# the registry just because its tag exists. That includes the upgrade path:
# previously published release images are upgraded to this build on the same
# volume and the migrated database must have every journal entry applied
# exactly once (v0.23.0 shipped an upgrade-only migration failure; see
# docs/RELEASE_NOTES_v0.23.1.md).
#
# After the registry is verified, the workflow creates the GitHub release from
# the checked-in notes document (docs/RELEASE_PROCESS.md): the Arena session
# that merged the release PR ends at the merge, so nothing here may depend on
# post-merge session work.
#
# Tags published for a release:
#   ghcr.io/<repo>:vX.Y.Z      (the release tag)
#   ghcr.io/<repo>:latest      (what Unraid's Force Update pulls)
#   ghcr.io/<repo>:sha-<short> (commit identifier for traceability)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (must already exist, e.g. v0.1.0)'
        required: true

# contents: write is needed for the final step, which creates the GitHub
# release from the checked-in notes document (docs/RELEASE_PROCESS.md).
permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, smoke test and push the release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the upgrade smoke resolves previously published
          # release tags, and the release step needs the notes document.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version and image name
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing to publish a non vX.Y.Z tag: $VERSION" >&2; exit 1 ;;
          esac
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VERSION (latest, sha-$SHORT_SHA)"

      - name: Verify the version metadata matches the tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MODULE_VERSION="$(node -p "require('fs').readFileSync('src/lib/version.ts','utf8').match(/APP_VERSION = '([^']+)'/)[1]")"
          test "v${PKG_VERSION}" = "$VERSION" || { echo "package.json ($PKG_VERSION) does not match $VERSION" >&2; exit 1; }
          test "v${MODULE_VERSION}" = "$VERSION" || { echo "src/lib/version.ts ($MODULE_VERSION) does not match $VERSION" >&2; exit 1; }
          echo "version metadata agrees with $VERSION"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Simple Finance
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade smoke test (previously published releases must migrate cleanly)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          # v0.23.0 shipped with an out-of-order migration journal stamp that
          # silently skipped migration 0012 on upgraded databases while fresh
          # installs stayed green (docs/RELEASE_NOTES_v0.23.1.md). The upgrade
          # path is therefore smoked against real previously published images
          # before anything is pushed: the two most recent release tags other
          # than this one are started on a fresh volume, stopped, and restarted
          # as the new image; the upgraded database must end healthy with every
          # journal entry applied exactly once at the journal's stamp.
          BASE_TAGS="$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -2 || true)"
          if [ -z "$BASE_TAGS" ]; then
            echo "no previously published tag found - skipping upgrade smoke"
            exit 0
          fi
          for BASE_TAG in $BASE_TAGS; do
            echo "=== upgrade smoke: $BASE_TAG -> $VERSION ==="
            docker pull "$IMAGE:$BASE_TAG"
            VOL="sf-upg-$(echo "$BASE_TAG" | tr '.' '-')"
            docker run -d --name sf-upg-base -p 3000:3000 -v "$VOL":/data $AUTH_ENV "$IMAGE:$BASE_TAG"
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:3000/api/health
            echo "base $BASE_TAG: healthy, database created"
            docker rm -f sf-upg-base
            docker run -d --name sf-upg-new -p 3000:3000 -v "$VOL":/data $AUTH_ENV "$IMAGE:$VERSION"
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:3000/api/health
            echo "upgraded $BASE_TAG -> $VERSION: healthy"
            docker exec sf-upg-new node -e '
              const fs = require("fs");
              const crypto = require("crypto");
              const Database = require("better-sqlite3");
              const folder = "/app/drizzle";
              const journal = JSON.parse(fs.readFileSync(folder + "/meta/_journal.json", "utf8"));
              const db = new Database("/data/simple-finance.sqlite", { readonly: true });
              const rows = db.prepare("SELECT hash, created_at FROM __drizzle_migrations").all();
              const byHash = new Map();
              for (const row of rows) byHash.set(row.hash, Number(row.created_at));
              let bad = 0;
              for (const entry of journal.entries) {
                const sql = fs.readFileSync(folder + "/" + entry.tag + ".sql", "utf8");
                const hash = crypto.createHash("sha256").update(sql).digest("hex");
                const at = byHash.get(hash);
                if (at === undefined) { console.log("NOT APPLIED:", entry.tag); bad += 1; }
                else if (at !== entry.when) { console.log("STAMP MISMATCH:", entry.tag, "db=" + at, "journal=" + entry.when); bad += 1; }
              }
              db.close();
              if (bad > 0) { console.log(bad + " journal entries are not applied exactly once"); process.exit(1); }
              console.log("all " + journal.entries.length + " journal entries applied exactly once");
            '
            docker rm -f sf-upg-new
            docker volume rm "$VOL"
          done

      - name: Smoke test the built image (start, health, unprivileged, persistence)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
        run: |
          set -eu
          AUTH_ENV="-e AUTH_ISSUER=https://example.cloudflareaccess.com -e AUTH_AUDIENCE=dummy-audience -e AUTH_ALLOWED_EMAILS=alex@example.com,sam@example.com"
          docker run -d --name sf-release -p 3000:3000 -v sf-release-data:/data $AUTH_ENV "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "health: ok"
          # Least privilege: the server process must not be running as root.
          SERVER_UID="$(docker exec sf-release awk '/^Uid:/{print $2}' /proc/1/status)"
          test "$SERVER_UID" = "99" || { echo "server runs as uid $SERVER_UID, expected 99" >&2; exit 1; }
          echo "least privilege: server runs as uid 99"
          test -n "$(docker exec sf-release ls -A /data/simple-finance.sqlite)"
          echo "database created under /data"
          docker rm -f sf-release
          docker run -d --name sf-release2 -p 3000:3000 -v sf-release-data:/data $AUTH_ENV "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test -n "$(docker exec sf-release2 ls -A /data/simple-finance.sqlite)"
          echo "database survived container recreation"
          docker rm -f sf-release2
          docker volume rm sf-release-data

          # PWA assets must be served by the published image.
          docker run -d --name sf-pwa -p 3000:3000 $AUTH_ENV "$IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for PWA_PATH in /manifest.webmanifest /icon-192.png /icon-512.png /apple-touch-icon.png; do
            HTTP_CODE="$(curl -sI -o /dev/null -w '%{http_code}' http://127.0.0.1:3000$PWA_PATH)"
            test "$HTTP_CODE" = "200" || { echo "$PWA_PATH returned $HTTP_CODE, expected 200" >&2; exit 1; }
            echo "PWA asset $PWA_PATH: 200"
          done
          docker rm -f sf-pwa

      - name: Push the verified image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -eu
          for TAG in "$VERSION" "latest" "sha-$SHORT_SHA"; do
            docker push "$IMAGE:$TAG"
          done
          echo "### Published $IMAGE:$VERSION (latest, sha-$SHORT_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the registry tags resolve
        id: verify
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -eu
          LOCAL_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          for TAG in "$VERSION" "latest" "sha-$SHORT_SHA"; do
            REMOTE_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$TAG")"
            echo "$IMAGE:$TAG -> $REMOTE_DIGEST"
          done
          REMOTE_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")"
          LOCAL_ONLY="${LOCAL_DIGEST#*@}"
          test "$REMOTE_DIGEST" = "$LOCAL_ONLY" || {
            echo "Registry digest ($REMOTE_DIGEST) does not match the built image ($LOCAL_ONLY)" >&2
            exit 1
          }
          echo "digest=$REMOTE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Registry digest $REMOTE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release from the checked-in notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -eu
          # The Arena session that merged the release PR ends at the merge, so
          # the release itself is created here, by the workflow, from the notes
          # document that shipped in the release PR. The document must exist
          # and start with '# Release notes — vX.Y.Z — <subject>' (em dashes,
          # as written by the notes documents); its first line becomes the
          # release title, and the verified facts (date, merge commit, image
          # tags, digest) are prepended.
          # See docs/RELEASE_PROCESS.md and decision 173.
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "$NOTES is missing - a release requires checked-in release notes" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists - leaving it untouched."
            exit 0
          fi
          TITLE="$(sed -n '1s/^# Release notes — //p' "$NOTES")"
          if [ -z "$TITLE" ]; then
            echo "The first line of $NOTES must be '# Release notes — $VERSION — <subject>'" >&2
            exit 1
          fi
          {
            echo "**Published:** $(date -u +%Y-%m-%d) by Publish run ${GITHUB_RUN_ID}."
            echo "**Merge commit:** \`${GITHUB_SHA}\` (short SHA \`$SHORT_SHA\`)."
            echo "**Image tags:** \`$IMAGE:$VERSION\` · \`$IMAGE:latest\` · \`$IMAGE:sha-$SHORT_SHA\`."
            echo "**Digest:** \`$DIGEST\`, shared by all three tags and verified against the registry by this run."
            echo
            cat "$NOTES"
            echo
            echo "[Release notes document](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RELEASE_NOTES_${VERSION}.md)"
          } > /tmp/release-body.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file /tmp/release-body.md --latest
          echo "### GitHub release $VERSION created and marked Latest" >> "$GITHUB_STEP_SUMMARY"
